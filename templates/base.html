<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuhoor - Where Data Acquires Shape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f7f0;
            color: #1a2e1a;
            min-height: 100vh;
        }

        .navbar {
            background: #1a3d2b;
            border-bottom: 3px solid #2d6a4f;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(26,61,43,0.3);
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: #95d5b2;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .navbar-brand span {
            color: #52b788;
        }

        .nav-subtitle {
            color: #74c69d;
            font-size: 0.85rem;
            font-weight: 400;
        }

        .main {
            padding: 32px 40px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .upload-hero {
            text-align: center;
            padding: 80px 20px;
        }

        .upload-hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            color: #1a3d2b;
            line-height: 1.2;
        }

        .upload-hero h1 span {
            color: #2d6a4f;
        }

        .upload-hero p {
            color: #52b788;
            font-size: 1.1rem;
            margin: 16px 0 40px;
            font-weight: 500;
        }

        .upload-box {
            background: white;
            border: 2px dashed #74c69d;
            border-radius: 28px;
            padding: 50px 40px;
            max-width: 580px;
            margin: 0 auto;
            transition: all 0.3s;
            box-shadow: 0 10px 40px rgba(45,106,79,0.1);
        }

        .upload-box:hover {
            border-color: #2d6a4f;
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(45,106,79,0.2);
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
        }

        .upload-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a3d2b;
            margin-bottom: 8px;
        }

        .upload-box p {
            color: #74c69d;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #2d6a4f, #52b788);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            letter-spacing: 0.3px;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(45,106,79,0.4);
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
            background: #1a3d2b;
            border-radius: 20px;
            padding: 24px 30px;
            box-shadow: 0 8px 30px rgba(26,61,43,0.25);
        }

        .dashboard-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #95d5b2;
            letter-spacing: -0.5px;
        }

        .dashboard-title span {
            color: #52b788;
        }

        .file-badge {
            background: rgba(149,213,178,0.15);
            border: 1px solid #52b788;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 0.85rem;
            color: #95d5b2;
            font-weight: 600;
        }

        .btn-new {
            background: rgba(149,213,178,0.1);
            border: 1px solid #52b788;
            border-radius: 12px;
            padding: 10px 22px;
            color: #95d5b2;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-new:hover {
            background: rgba(149,213,178,0.25);
            color: white;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border: none;
            border-left: 5px solid #52b788;
            border-radius: 16px;
            padding: 22px 24px;
            text-align: left;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(45,106,79,0.08);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(45,106,79,0.18);
            border-left-color: #2d6a4f;
        }

        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #2d6a4f;
            line-height: 1;
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: #74c69d;
            margin-top: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: white;
            border: none;
            border-radius: 18px;
            padding: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(45,106,79,0.08);
            border-top: 4px solid #52b788;
        }

        .chart-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(45,106,79,0.18);
            border-top-color: #2d6a4f;
        }

        .chart-card:first-child {
            grid-column: span 2;
        }

        .chart-card:nth-child(4) {
            grid-column: span 2;
        }

        .preview-section {
            background: white;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(45,106,79,0.08);
            border-top: 4px solid #95d5b2;
        }

        .section-heading {
            font-size: 1rem;
            font-weight: 700;
            color: #1a3d2b;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-heading .tag {
            background: #d8f3dc;
            color: #2d6a4f;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .preview-table th {
            background: #d8f3dc;
            color: #2d6a4f;
            font-weight: 700;
            padding: 12px 16px;
            text-align: left;
            border: none;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        .preview-table td {
            padding: 11px 16px;
            border-bottom: 1px solid #f0f7f0;
            color: #1a2e1a;
        }

        .preview-table tr:hover td {
            background: #f0f7f0;
        }

        .progress-section {
            background: white;
            border-radius: 18px;
            padding: 22px 26px;
            margin-bottom: 22px;
            box-shadow: 0 4px 15px rgba(45,106,79,0.08);
        }

        .stat-badge-mini {
            background: white;
            border: 1px solid #b7e4c7;
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(45,106,79,0.08);
        }

        .stat-badge-mini .num {
            font-size: 1.5rem;
            font-weight: 800;
            color: #2d6a4f;
        }

        .stat-badge-mini .lbl {
            font-size: 0.72rem;
            color: #74c69d;
            margin-top: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-card:first-child { grid-column: span 1; }
            .chart-card:nth-child(4) { grid-column: span 1; }
        }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .main { padding: 20px; }
            .upload-hero h1 { font-size: 2rem; }
            .dashboard-header { padding: 18px 20px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="display:flex; flex-direction:column; align-items:flex-start;">
        <a class="navbar-brand" href="/">Zuhoor <span>Analytics</span></a>
        <span style="color:#52b788; font-size:0.72rem; font-weight:600; margin-top:2px;">
            by Maaz Gazi
        </span>
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
        <span class="nav-subtitle">Where Data Acquires Shape</span>
        {% if current_user.is_authenticated %}
        <span style="color:#95d5b2; font-size:0.85rem; font-weight:600;">
            Hello, {{ current_user.naam }}!
        </span>
        <a href="/logout"
           style="background:rgba(149,213,178,0.15); border:1px solid #52b788;
                  border-radius:10px; padding:8px 18px; color:#95d5b2;
                  font-size:0.85rem; font-weight:600; text-decoration:none;">
            Logout
        </a>
        {% endif %}
    </div>
</nav>

<div class="main">
    {% block content %}{% endblock %}
</div>

</body>
</html>
